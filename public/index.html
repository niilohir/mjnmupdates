<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MJNM UPDATES</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f9f9;
    --text: #0f1419;
    --muted: #536471;
    --border: #eff3f4;
    --accent: #6d5dfc;
    --accent-hover: #5a49f0;
    --danger: #e0245e;
    --focus: rgba(109, 93, 252, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #16181c;
      --text: #e7e9ea;
      --muted: #71767b;
      --border: #2f3336;
      --accent: #8b7dff;
      --accent-hover: #9d91ff;
      --danger: #f4212e;
      --focus: rgba(139, 125, 255, .3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  .col {
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  @media (max-width: 600px) { .col { border: 0; } }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: .02em; }
  h1 span { margin-left: 6px; }
  .ghost {
    background: none; border: 0; cursor: pointer;
    color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: 999px;
  }
  .ghost:hover { background: var(--surface); color: var(--text); }

  .ghost.accent { color: var(--accent); font-weight: 700; border: 1px solid var(--border); }

  /* Team login panel */
  .login { padding: 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .login p { margin: 0 0 10px; color: var(--muted); font-size: 14px; }
  .login-row { display: flex; gap: 8px; }
  .login-row .field { flex: 1; min-width: 0; padding: 10px 12px; }
  .login .error { margin-top: 6px; min-height: 0; }
  .field {
    width: 100%; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .btn {
    background: var(--accent); color: #fff; border: 0; cursor: pointer;
    font-weight: 700; padding: 10px 18px; border-radius: 999px;
  }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .error { color: var(--danger); font-size: 14px; min-height: 20px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* Composer */
  .composer { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--border); }
  .composer-body { flex: 1; min-width: 0; }
  .who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 4px; }
  .who-label { color: var(--muted); font-size: 13px; margin-right: 2px; }
  .chip {
    --c: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chip:hover { border-color: var(--c); }
  .chip:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  .chip[aria-checked="true"] { background: var(--c); border-color: var(--c); color: #fff; }
  .chip[aria-checked="true"] .dot { background: #fff; }
  .text-input {
    display: block; width: 100%; resize: none; border: 0; outline: none; background: none;
    font-size: 19px; line-height: 1.35; padding: 6px 0 10px; min-height: 56px; overflow: hidden;
  }
  .text-input::placeholder { color: var(--muted); }
  .composer-foot {
    display: flex; justify-content: flex-end; align-items: center; gap: 12px;
    border-top: 1px solid var(--border); padding-top: 10px;
  }
  .icon-btn {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: none; border: 0; cursor: pointer; color: var(--accent);
  }
  .icon-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .icon-btn:disabled { opacity: .4; cursor: default; }
  .photo-preview { position: relative; display: inline-block; max-width: 100%; margin-bottom: 10px; }
  .photo-preview img {
    display: block; max-width: 100%; max-height: 280px;
    border-radius: 14px; border: 1px solid var(--border);
  }
  .photo-preview.busy img { opacity: .5; }
  .photo-remove {
    position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%;
    border: 0; cursor: pointer; background: rgba(0, 0, 0, .7); color: #fff; font-size: 15px; line-height: 1;
  }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--danger); font-weight: 700; }
  .composer .error { flex: 1; min-height: 0; }

  /* Feed */
  .avatar {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: 17px; text-transform: uppercase;
    user-select: none;
  }
  .post { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .post:hover { background: var(--surface); }
  .post.new { animation: fadein .5s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-6px); } }
  .post-body { flex: 1; min-width: 0; }
  .post-head { display: flex; gap: 4px; align-items: baseline; white-space: nowrap; }
  .post-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .post-time { color: var(--muted); flex: none; }
  .del {
    margin-left: auto; flex: none; align-self: center;
    background: none; border: 0; cursor: pointer;
    color: var(--muted); font-size: 13px; padding: 2px 10px; border-radius: 999px;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .del.confirm { color: #fff; background: var(--danger); font-weight: 700; }
  .del:disabled { opacity: .6; cursor: default; }
  .post-text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .post-text a { color: var(--accent); text-decoration: none; }
  .post-text a:hover { text-decoration: underline; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .react {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 28px; min-width: 28px; padding: 0 10px; border-radius: 999px;
    border: 1px solid var(--border); background: none; cursor: pointer;
    color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .react .e { font-size: 15px; line-height: 1; }
  .react:hover:not(:disabled) { border-color: var(--accent); }
  .react:disabled { cursor: default; }
  .react.mine {
    color: var(--accent); border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  .react.like:hover:not(:disabled) { border-color: var(--danger); }
  .react.like.mine {
    color: var(--danger); border-color: var(--danger);
    background: color-mix(in srgb, var(--danger) 12%, transparent);
  }
  .react.add { padding: 0 8px; }
  .tray {
    display: inline-flex; gap: 2px; padding: 2px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--bg);
    animation: fadein .15s ease-out;
  }
  .tray button {
    width: 34px; height: 28px; border: 0; border-radius: 999px;
    background: none; cursor: pointer; font-size: 17px; line-height: 1;
  }
  .tray button:hover { background: var(--surface); }
  .tray button.mine { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .img-btn {
    display: block; margin-top: 8px; padding: 0; border: 0; background: none;
    max-width: 100%; cursor: zoom-in; border-radius: 14px;
  }
  .post-img {
    display: block; max-width: 100%; max-height: 510px; width: auto; height: auto;
    border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
  }
  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center; padding: 16px;
    background: rgba(0, 0, 0, .9); cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  .empty, .status { padding: 48px 16px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="col">
  <header>
    <h1>MJNM UPDATES<span aria-hidden="true">🌙</span></h1>
    <button id="authBtn" class="ghost accent" type="button">Team login</button>
  </header>

  <main>
    <section id="loginPanel" class="login hidden">
      <p>Team members: enter the password to post updates.</p>
      <form id="loginForm">
        <div class="login-row">
          <input id="pwInput" class="field" type="password" placeholder="Team password" autocomplete="current-password" required aria-label="Team password">
          <button class="btn" type="submit">Log in</button>
        </div>
        <div id="loginError" class="error" role="alert"></div>
      </form>
    </section>

    <form id="composer" class="composer hidden">
      <div id="meAvatar" class="avatar" aria-hidden="true">?</div>
      <div class="composer-body">
        <div id="who" class="who" role="radiogroup" aria-label="Posting as"><span class="who-label">Posting as</span></div>
        <textarea id="textInput" class="text-input" rows="1" placeholder="What's the update?" aria-label="Update"></textarea>
        <div id="photoPreview" class="photo-preview hidden">
          <img id="photoImg" alt="Photo to post">
          <button id="photoRemove" class="photo-remove" type="button" aria-label="Remove photo">✕</button>
        </div>
        <div class="composer-foot">
          <button id="photoBtn" class="icon-btn" type="button" aria-label="Add photo" title="Add photo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
          </button>
          <input id="photoInput" type="file" accept="image/*" hidden>
          <div id="postError" class="error" role="alert"></div>
          <span id="count" class="count">280</span>
          <button id="postBtn" class="btn" type="submit" disabled>Post</button>
        </div>
      </div>
    </form>

    <div id="feed"><div class="status">Loading…</div></div>
  </main>
</div>

<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Photo, click or press Escape to close" tabindex="-1">
  <img id="lightboxImg" alt="">
</div>

<script>
(() => {
  const MAX = 280;
  const POLL_MS = 15000;
  const $ = (id) => document.getElementById(id);

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let password = store.get("mjnm-pw");
  let seenIds = null;
  let lastPosts = [];
  let confirmingId = null; // post waiting for a second "Delete?" click
  let confirmTimer = null;
  let renderedDay = null;
  let photo = null;      // { blob, width, height, url } ready to upload
  let photoBusy = false; // true while a picked photo is being shrunk
  let reactionSet = [];  // available emoji, from the server; the first is the "like"
  let pickerFor = null;  // post whose reaction picker is open

  // ---------- helpers ----------
  // The team list (names + colors) comes from the server, see lib/team.js.
  let team = [];
  const colors = ["#6d5dfc", "#1d9bf0", "#00ba7c", "#f91880", "#ff7a00", "#7856ff", "#e0245e", "#0e9f9a", "#c2410c", "#2563eb"];
  function colorFor(name) {
    const member = team.find((m) => m.name === name);
    if (member) return member.color;
    // Fallback for names that aren't on the list (e.g. old posts).
    let h = 0;
    for (const c of name.toLowerCase()) h = (h * 31 + c.codePointAt(0)) >>> 0;
    return colors[h % colors.length];
  }
  function initial(name) { return [...(name.trim() || "?")][0]; }

  function pad(n) { return String(n).padStart(2, "0"); }
  function formatTime(ms) {
    const d = new Date(ms);
    const now = new Date();
    const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    if (ms >= startOfToday) return hm;
    if (ms >= startOfToday - 86400000) return `Yesterday ${hm}`;
    const opts = { month: "short", day: "numeric" };
    if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
    return `${d.toLocaleDateString(undefined, opts)}, ${hm}`;
  }

  const urlRe = /\bhttps?:\/\/[^\s<]+[^\s<.,:;"')\]!?]/g;
  function renderText(el, text) {
    let last = 0;
    for (const m of text.matchAll(urlRe)) {
      if (m.index > last) el.append(text.slice(last, m.index));
      const a = document.createElement("a");
      a.href = m[0];
      a.textContent = m[0];
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      el.append(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) el.append(text.slice(last));
  }

  async function api(method, path, { body, pw } = {}) {
    const headers = {};
    if (pw) headers["x-team-password"] = pw;
    const isForm = body instanceof FormData; // the browser sets the form's content type
    if (body && !isForm) headers["content-type"] = "application/json";
    const res = await fetch(path, { method, headers, body: isForm ? body : body ? JSON.stringify(body) : undefined });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok) {
      const err = new Error(data.error || `Something went wrong (${res.status}).`);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // ---------- team login state ----------
  function setLoggedIn(on) {
    $("composer").classList.toggle("hidden", !on);
    $("authBtn").textContent = on ? "Log out" : "Team login";
    $("authBtn").classList.toggle("accent", !on);
    if (on) {
      $("loginPanel").classList.add("hidden");
      updateMe();
    }
    // Show or hide the delete buttons.
    if (seenIds) renderFeed(lastPosts);
  }

  function focusComposer() {
    if (me) textInput.focus();
    else $("who").querySelector(".chip")?.focus();
  }

  function openLogin(message = "") {
    $("loginPanel").classList.remove("hidden");
    $("loginError").textContent = message;
    $("pwInput").value = "";
    $("pwInput").focus();
  }

  function logout() {
    store.del("mjnm-pw");
    password = null;
    setLoggedIn(false);
  }

  $("authBtn").addEventListener("click", () => {
    if (password) return logout();
    if ($("loginPanel").classList.contains("hidden")) openLogin();
    else $("loginPanel").classList.add("hidden");
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const pw = $("pwInput").value;
    $("loginError").textContent = "";
    try {
      await api("POST", "/api/login", { pw });
      password = pw;
      store.set("mjnm-pw", pw);
      setLoggedIn(true);
      focusComposer();
    } catch (err) {
      $("loginError").textContent = err.status === 401 ? "Wrong password. Try again." : err.message;
      $("loginForm").classList.remove("shake");
      void $("loginForm").offsetWidth;
      $("loginForm").classList.add("shake");
      $("pwInput").select();
    }
  });

  // ---------- feed ----------
  function renderFeed(posts) {
    const feed = $("feed");
    feed.replaceChildren();
    if (!posts.length) {
      feed.innerHTML = '<div class="empty">No updates yet.</div>';
    }
    for (const p of posts) {
      const row = document.createElement("article");
      row.className = "post";
      if (seenIds && !seenIds.has(p.id)) row.classList.add("new");

      const av = document.createElement("div");
      av.className = "avatar";
      av.style.background = colorFor(p.name);
      av.textContent = initial(p.name);
      av.setAttribute("aria-hidden", "true");

      const body = document.createElement("div");
      body.className = "post-body";

      const head = document.createElement("div");
      head.className = "post-head";
      const name = document.createElement("span");
      name.className = "post-name";
      name.textContent = p.name;
      const time = document.createElement("time");
      time.className = "post-time";
      time.dateTime = new Date(p.created_at).toISOString();
      time.title = new Date(p.created_at).toLocaleString();
      time.textContent = "· " + formatTime(p.created_at);
      head.append(name, time);

      if (password) {
        const del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        const confirming = confirmingId === p.id;
        del.classList.toggle("confirm", confirming);
        del.textContent = confirming ? "Delete?" : "Delete";
        del.setAttribute("aria-label", confirming ? `Confirm deleting post by ${p.name}` : `Delete post by ${p.name}`);
        del.addEventListener("click", () => deletePost(p.id, del));
        head.append(del);
      }

      body.append(head);
      if (p.text) {
        const text = document.createElement("div");
        text.className = "post-text";
        renderText(text, p.text);
        body.append(text);
      }

      if (p.image) {
        const open = document.createElement("button");
        open.type = "button";
        open.className = "img-btn";
        open.setAttribute("aria-label", `Open photo from ${p.name} full size`);
        const img = document.createElement("img");
        img.className = "post-img";
        img.src = p.image.url;
        img.width = p.image.width;
        img.height = p.image.height;
        img.loading = "lazy";
        img.decoding = "async";
        img.alt = "";
        open.append(img);
        open.addEventListener("click", () => openLightbox(p.image.url));
        body.append(open);
      }

      const actions = renderReactions(p);
      if (actions) body.append(actions);

      row.append(av, body);
      feed.append(row);
    }
    seenIds = new Set(posts.map((p) => p.id));
    lastPosts = posts;
  }

  // First click arms the button ("Delete?"), second click within 4s deletes.
  async function deletePost(id, button) {
    clearTimeout(confirmTimer);
    if (confirmingId !== id) {
      confirmingId = id;
      renderFeed(lastPosts);
      confirmTimer = setTimeout(() => { confirmingId = null; renderFeed(lastPosts); }, 4000);
      return;
    }
    confirmingId = null;
    button.disabled = true;
    button.textContent = "Deleting…";
    try {
      await api("DELETE", `/api/posts?id=${id}`, { pw: password });
      renderFeed(lastPosts.filter((p) => p.id !== id));
    } catch (err) {
      if (err.status === 401) { logout(); openLogin("The team password has changed. Log in again."); }
      else if (err.status !== 404) alertInline(err.message);
      refresh();
    }
  }

  function alertInline(message) {
    const s = document.createElement("div");
    s.className = "status error";
    s.style.padding = "12px 16px";
    s.textContent = message;
    $("feed").prepend(s);
    setTimeout(() => s.remove(), 4000);
  }

  async function refresh() {
    try {
      const data = await api("GET", "/api/posts");
      if (data.reactions) reactionSet = data.reactions;
      if (data.team && JSON.stringify(data.team) !== JSON.stringify(team)) {
        team = data.team;
        if (me && !team.some((m) => m.name === me)) me = null;
        renderWho();
      }
      // Only redraw when something changed (or the date rolled over, for
      // "Yesterday" labels), so photos don't flicker on every poll.
      const today = new Date().toDateString();
      if (!seenIds || today !== renderedDay || JSON.stringify(data.posts) !== JSON.stringify(lastPosts)) {
        renderedDay = today;
        renderFeed(data.posts);
      }
    } catch (e) {
      if (!seenIds) {
        const s = document.createElement("div");
        s.className = "status";
        s.textContent = e.message;
        $("feed").replaceChildren(s);
      }
    }
  }

  setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

  // ---------- composer ----------
  const textInput = $("textInput");
  let me = store.get("mjnm-name"); // who this browser posts as

  function renderWho() {
    const who = $("who");
    who.querySelectorAll(".chip").forEach((c) => c.remove());
    for (const m of team) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.setAttribute("role", "radio");
      chip.setAttribute("aria-checked", String(m.name === me));
      chip.style.setProperty("--c", m.color);
      const dot = document.createElement("span");
      dot.className = "dot";
      chip.append(dot, m.name);
      chip.addEventListener("click", () => {
        me = m.name;
        store.set("mjnm-name", me);
        $("postError").textContent = "";
        renderWho();
        if (seenIds) renderFeed(lastPosts); // highlight this person's reactions
        textInput.focus();
      });
      who.append(chip);
    }
    updateMe();
  }

  function updateMe() {
    $("meAvatar").textContent = me ? initial(me) : "?";
    $("meAvatar").style.background = me ? colorFor(me) : "var(--muted)";
    updateComposer();
  }
  function updateComposer() {
    const len = [...textInput.value].length;
    const left = MAX - len;
    $("count").textContent = left;
    $("count").classList.toggle("over", left < 0);
    $("postBtn").disabled = !me || left < 0 || photoBusy || (!textInput.value.trim() && !photo);
    $("photoBtn").disabled = photoBusy;
    textInput.style.height = "auto";
    textInput.style.height = textInput.scrollHeight + "px";
  }
  textInput.addEventListener("input", () => { $("postError").textContent = ""; updateComposer(); });
  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("composer").requestSubmit(); }
  });

  // ---------- photos ----------
  const MAX_SIDE = 1600;
  const MAX_BYTES = 1_200_000;

  // Shrinks a photo in the browser before upload: max 1600px on the long side,
  // saved as JPEG. Redrawing it also drops hidden metadata such as GPS location.
  async function shrinkPhoto(file) {
    const src = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = src;
      try { await img.decode(); }
      catch { throw new Error("Couldn't read that photo. Try a JPG or PNG."); }
      const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const width = Math.max(1, Math.round(img.naturalWidth * scale));
      const height = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; // transparent PNGs get a white background
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      for (const quality of [0.82, 0.7, 0.55]) {
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
        if (blob && blob.size <= MAX_BYTES) return { blob, width, height };
      }
      throw new Error("That photo is too big, even after shrinking.");
    } finally {
      URL.revokeObjectURL(src);
    }
  }

  async function attachPhoto(file) {
    if (!file) return;
    if (!file.type.startsWith("image/")) { $("postError").textContent = "That isn't a photo."; return; }
    $("postError").textContent = "";
    clearPhoto();
    photoBusy = true;
    updateComposer();
    try {
      const shrunk = await shrinkPhoto(file);
      photo = { ...shrunk, url: URL.createObjectURL(shrunk.blob) };
      $("photoImg").src = photo.url;
      $("photoPreview").classList.remove("hidden");
      textInput.focus();
    } catch (err) {
      $("postError").textContent = err.message;
    } finally {
      photoBusy = false;
      updateComposer();
    }
  }

  function clearPhoto() {
    if (photo) URL.revokeObjectURL(photo.url);
    photo = null;
    $("photoInput").value = "";
    $("photoImg").removeAttribute("src");
    $("photoPreview").classList.add("hidden");
    updateComposer();
  }

  $("photoBtn").addEventListener("click", () => $("photoInput").click());
  $("photoInput").addEventListener("change", () => attachPhoto($("photoInput").files[0]));
  $("photoRemove").addEventListener("click", () => { clearPhoto(); textInput.focus(); });
  // Pasting a screenshot into the text box attaches it too.
  textInput.addEventListener("paste", (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.kind === "file" && i.type.startsWith("image/"));
    if (item) { e.preventDefault(); attachPhoto(item.getAsFile()); }
  });

  // ---------- full-size photo view ----------
  let lightboxReturnFocus = null;
  function openLightbox(url) {
    lightboxReturnFocus = document.activeElement;
    $("lightboxImg").src = url;
    $("lightbox").classList.remove("hidden");
    $("lightbox").focus();
  }
  function closeLightbox() {
    $("lightbox").classList.add("hidden");
    $("lightboxImg").removeAttribute("src");
    lightboxReturnFocus?.focus();
  }
  $("lightbox").addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("lightbox").classList.contains("hidden")) closeLightbox();
    else if (pickerFor !== null) { pickerFor = null; renderFeed(lastPosts); }
  });

  // ---------- likes & reactions ----------
  // Guests see the counts; logged-in members can add and remove their own.
  function renderReactions(p) {
    const canReact = Boolean(password);
    const rx = p.reactions || [];
    if (!canReact && !rx.length) return null;
    const like = reactionSet[0];

    const row = document.createElement("div");
    row.className = "actions";

    for (const emoji of reactionSet) {
      const r = rx.find((x) => x.emoji === emoji);
      const isLike = emoji === like;
      // The like button is always there for members; other emoji only once someone used them.
      if (!r && !(isLike && canReact)) continue;
      const mine = Boolean(r && me && r.names.includes(me));

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "react" + (isLike ? " like" : "") + (mine ? " mine" : "");
      btn.disabled = !canReact;
      const icon = document.createElement("span");
      icon.className = "e";
      icon.textContent = isLike && !r ? "🤍" : emoji;
      btn.append(icon);
      if (r) btn.append(String(r.names.length));
      const who = r ? r.names.join(", ") : "";
      btn.title = r ? who : "Like";
      btn.setAttribute("aria-label", r ? `${emoji} ${r.names.length}: ${who}` : "Like");
      btn.setAttribute("aria-pressed", String(mine));
      btn.addEventListener("click", () => setReaction(p.id, emoji, !mine));
      row.append(btn);
    }

    if (canReact) {
      const add = document.createElement("button");
      add.type = "button";
      add.className = "react add";
      add.title = "React";
      add.setAttribute("aria-label", "Add a reaction");
      add.setAttribute("aria-expanded", String(pickerFor === p.id));
      add.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="13" r="8"/><path d="M8 15c.8 1 1.8 1.5 3 1.5s2.2-.5 3-1.5"/><path d="M8.5 10.5h.01M13.5 10.5h.01"/><path d="M20 2v6M17 5h6"/></svg>';
      add.addEventListener("click", (e) => {
        e.stopPropagation();
        pickerFor = pickerFor === p.id ? null : p.id;
        renderFeed(lastPosts);
      });
      row.append(add);

      if (pickerFor === p.id) {
        const tray = document.createElement("div");
        tray.className = "tray";
        tray.setAttribute("role", "group");
        tray.setAttribute("aria-label", "Pick a reaction");
        for (const emoji of reactionSet.slice(1)) {
          const r = rx.find((x) => x.emoji === emoji);
          const mine = Boolean(r && me && r.names.includes(me));
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = emoji;
          if (mine) b.className = "mine";
          b.setAttribute("aria-label", `${mine ? "Remove" : "React with"} ${emoji}`);
          b.addEventListener("click", (e) => { e.stopPropagation(); setReaction(p.id, emoji, !mine); });
          tray.append(b);
        }
        row.append(tray);
      }
    }
    return row;
  }

  // Updates the screen straight away, then tells the server; the next refresh
  // corrects things if the server disagreed.
  async function setReaction(postId, emoji, on) {
    if (!password) return;
    if (!me) {
      $("postError").textContent = "Pick who you are first.";
      $("composer").scrollIntoView({ behavior: "smooth", block: "start" });
      $("who").querySelector(".chip")?.focus({ preventScroll: true });
      return;
    }
    pickerFor = null;
    renderFeed(lastPosts.map((p) => (p.id === postId ? { ...p, reactions: withReaction(p.reactions || [], emoji, on) } : p)));
    try {
      await api("POST", "/api/reactions", { pw: password, body: { post_id: postId, name: me, emoji, on } });
    } catch (err) {
      if (err.status === 401) { logout(); openLogin("The team password has changed. Log in again."); }
      else alertInline(err.message);
    }
    refresh();
  }

  function withReaction(list, emoji, on) {
    const byEmoji = new Map(list.map((r) => [r.emoji, r.names.filter((n) => n !== me || r.emoji !== emoji)]));
    if (on) byEmoji.set(emoji, [...(byEmoji.get(emoji) || []), me]);
    return reactionSet
      .filter((e) => byEmoji.get(e)?.length)
      .map((e) => ({ emoji: e, names: byEmoji.get(e) }));
  }

  // Clicking anywhere else closes an open reaction picker.
  document.addEventListener("click", (e) => {
    if (pickerFor !== null && !e.target.closest(".tray")) { pickerFor = null; renderFeed(lastPosts); }
  });

  $("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    if ($("postBtn").disabled) return;
    $("postBtn").disabled = true;
    $("postBtn").textContent = "Posting…";
    try {
      const form = new FormData();
      form.set("name", me);
      form.set("text", textInput.value.trim());
      if (photo) {
        form.set("image", photo.blob, "photo.jpg");
        form.set("width", photo.width);
        form.set("height", photo.height);
      }
      await api("POST", "/api/posts", { pw: password, body: form });
      textInput.value = "";
      clearPhoto();
      await refresh();
    } catch (err) {
      if (err.status === 401) { logout(); openLogin("The team password has changed. Log in again."); }
      else $("postError").textContent = err.message;
    } finally {
      $("postBtn").textContent = "Post";
      updateComposer();
    }
  });

  // ---------- start ----------
  setLoggedIn(false);
  refresh();
  if (password) {
    // Re-check a remembered password; a changed one logs you out.
    api("POST", "/api/login", { pw: password })
      .then(() => setLoggedIn(true))
      .catch((err) => { if (err.status === 401) logout(); else setLoggedIn(true); });
  }
})();
</script>
</body>
</html>
